name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install node deps
        run: npm ci

      - name: moon update
        run: moon update

      - name: moon check
        run: |
          moon check src/score src/metrics --target all
          moon check src/query src/query_sql src/static_search --target all
          moon check src/cli --target js

      - name: moon test
        run: |
          moon test src/score src/metrics --target all
          moon test src/query src/query_sql src/static_search --target all

      - name: moonbit interfaces are up to date
        run: |
          moon info
          git diff --exit-code -- 'src/**/pkg.generated.mbti'

      - name: python tests
        run: python3 -m unittest scripts/build_index_test.py

      - name: interface string catalogs are up to date
        run: node scripts/i18n.mjs check

      - name: build moonbit modules for the web code
        run: npm run build:moonbit

      - name: web typecheck
        run: npm run typecheck

      - name: web tests
        run: npm test

      - name: dynamic build
        run: npm run build

      # The deployment fetches download counts; CI only checks that the data
      # builds, without sending ~3000 requests to mooncakes.io on every push.
      - name: static data build
        run: |
          python3 scripts/build_index.py --db data/mooncake.db --skip-mooncakes-downloads
          python3 scripts/export_static_json.py --db data/mooncake.db --out public/data

      - name: static site build
        run: npm run build:static
