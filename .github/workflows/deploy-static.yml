name: deploy-static

on:
  workflow_dispatch:
  schedule:
    # 00:00 Japan time (UTC+9) every day.
    - cron: "0 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install node deps
        run: npm ci

      - name: moon update
        run: moon update

      # The download counts of earlier days, so that the 30-day momentum
      # can compare downloads; build_index.py keeps 45 days of snapshots.
      - name: restore download history
        uses: actions/cache/restore@v4
        with:
          path: data/download_history.json
          key: download-history-${{ github.run_id }}
          restore-keys: download-history-

      - name: build static data
        run: npm run build:static-data

      - name: save download history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/download_history.json
          key: download-history-${{ github.run_id }}

      - name: build static site
        run: npm run build:static

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
